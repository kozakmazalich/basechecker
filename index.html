<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Airdrop Checker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        body {
            background: #0a0b0d;
            color: #ffffff;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #0052ff, #00d395);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #888;
            font-size: 1.1rem;
        }
        
        .search-box {
            background: #1a1d26;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid #2a2f3d;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            color: #e0e0e0;
            font-weight: 500;
        }
        
        .input-wrapper {
            display: flex;
            gap: 12px;
        }
        
        input {
            flex: 1;
            padding: 16px 20px;
            background: #0f1117;
            border: 1px solid #2a2f3d;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
        }
        
        input:focus {
            outline: none;
            border-color: #0052ff;
        }
        
        button {
            background: #0052ff;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        button:hover {
            background: #0042d6;
        }
        
        .result {
            display: none;
            background: #1a1d26;
            border-radius: 16px;
            padding: 40px 30px;
            margin-top: 20px;
            border: 1px solid #2a2f3d;
            text-align: center;
        }
        
        .allocation-card {
            margin-bottom: 30px;
        }
        
        .allocation-title {
            font-size: 1.3rem;
            margin-bottom: 25px;
            color: #e0e0e0;
            opacity: 0.9;
        }
        
        .allocation-amount {
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00d395, #0052ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            line-height: 1.1;
        }
        
        .allocation-usd {
            font-size: 1.5rem;
            color: #00d395;
            margin-bottom: 30px;
        }
        
        .eligibility {
            padding: 20px;
            border-radius: 12px;
            background: #0f1729;
            margin-bottom: 25px;
        }
        
        .eligible {
            color: #00d395;
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .not-eligible {
            color: #ff4757;
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            border: 3px solid #2a2f3d;
            border-top: 3px solid #0052ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .api-status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        
        .api-success {
            background: rgba(0, 211, 149, 0.1);
            color: #00d395;
            border: 1px solid #00d395;
        }
        
        .api-error {
            background: rgba(255, 71, 87, 0.1);
            color: #ff4757;
            border: 1px solid #ff4757;
        }
        
        @media (max-width: 768px) {
            .input-wrapper {
                flex-direction: column;
            }
            
            .allocation-amount {
                font-size: 2.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">Base Airdrop</div>
            <div class="subtitle">Real blockchain data from wenser.xyz</div>
        </header>
        
        <div class="search-box">
            <div class="input-group">
                <label>Enter Ethereum Address</label>
                <div class="input-wrapper">
                    <input type="text" id="wallet-address" placeholder="0x...">
                    <button id="check-btn">Check Real Allocation</button>
                </div>
            </div>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>Fetching real data from wenser.xyz...</div>
        </div>
        
        <div class="result" id="result">
            <div class="api-status" id="api-status"></div>
            
            <div class="allocation-card">
                <div class="allocation-title">Real Airdrop Allocation</div>
                <div class="allocation-amount" id="base-amount">-</div>
                <div class="allocation-usd" id="usd-amount">-</div>
            </div>
            
            <div class="eligibility">
                <div id="eligibility-text">-</div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const checkBtn = document.getElementById('check-btn');
            const walletInput = document.getElementById('wallet-address');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const baseAmount = document.getElementById('base-amount');
            const usdAmount = document.getElementById('usd-amount');
            const eligibilityText = document.getElementById('eligibility-text');
            const apiStatus = document.getElementById('api-status');

            async function fetchRealDataFromWenser(walletAddress) {
                try {
                    // Direct fetch from wenser.xyz API
                    const response = await fetch(`https://wenser.xyz/api/check/base/${walletAddress}`, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        return data;
                    } else {
                        // If the API endpoint doesn't work, try to scrape the data
                        return await fetchFromWenserScrape(walletAddress);
                    }
                } catch (error) {
                    console.error('Error fetching from wenser.xyz:', error);
                    throw new Error('Failed to connect to wenser.xyz');
                }
            }

            async function fetchFromWenserScrape(walletAddress) {
                try {
                    // Alternative approach if direct API doesn't work
                    const response = await fetch(`https://wenser.xyz/check/base/${walletAddress}`);
                    const html = await response.text();
                    
                    // Parse the HTML to extract the data
                    // This would need to be adjusted based on the actual HTML structure
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    
                    // Extract points and allocation data from the page
                    // You'll need to inspect the actual page structure and update these selectors
                    const pointsElement = doc.querySelector('[data-points]') || doc.querySelector('.points');
                    const allocationElement = doc.querySelector('[data-allocation]') || doc.querySelector('.allocation');
                    
                    let points = 0;
                    let allocation = 0;
                    
                    if (pointsElement) {
                        points = parseInt(pointsElement.textContent) || 0;
                    }
                    
                    if (allocationElement) {
                        allocation = parseInt(allocationElement.textContent) || 0;
                    }
                    
                    return {
                        points: points,
                        allocation: allocation,
                        eligible: points > 0 && allocation > 0
                    };
                } catch (error) {
                    console.error('Error scraping wenser.xyz:', error);
                    throw new Error('Failed to get data from wenser.xyz');
                }
            }

            checkBtn.addEventListener('click', async function() {
                const address = walletInput.value.trim();

                if (!address) {
                    alert('Please enter a wallet address');
                    return;
                }

                if (!address.startsWith('0x') || address.length !== 42) {
                    alert('Please enter a valid Ethereum wallet address (0x...)');
                    return;
                }

                loading.style.display = 'block';
                result.style.display = 'none';
                apiStatus.textContent = '';

                try {
                    // Fetch REAL data from wenser.xyz
                    const data = await fetchRealDataFromWenser(address);

                    if (data && data.eligible !== undefined) {
                        if (data.eligible && data.allocation > 0) {
                            baseAmount.textContent = data.allocation.toLocaleString() + ' BASE';
                            usdAmount.textContent = '$' + (data.allocation * 0.22).toLocaleString(undefined, { 
                                minimumFractionDigits: 2, 
                                maximumFractionDigits: 2 
                            }) + ' USD';
                            eligibilityText.innerHTML = '<span class="eligible">✓ Eligible for Airdrop</span>';
                            apiStatus.textContent = '✓ Real data from wenser.xyz';
                            apiStatus.className = 'api-status api-success';
                        } else {
                            baseAmount.textContent = '0 BASE';
                            usdAmount.textContent = '$0 USD';
                            eligibilityText.innerHTML = '<span class="not-eligible">✗ Not Eligible</span>';
                            apiStatus.textContent = '✓ Real data from wenser.xyz';
                            apiStatus.className = 'api-status api-success';
                        }
                    } else {
                        throw new Error('Invalid data format from API');
                    }

                } catch (error) {
                    baseAmount.textContent = 'Error';
                    usdAmount.textContent = 'API Unavailable';
                    eligibilityText.innerHTML = '<span class="not-eligible">✗ ' + error.message + '</span>';
                    apiStatus.textContent = '✗ ' + error.message;
                    apiStatus.className = 'api-status api-error';
                }

                loading.style.display = 'none';
                result.style.display = 'block';
            });

            // Example addresses for testing
            walletInput.placeholder = 'Try: 0x742d35Cc6634C0532925a3b8D4EDa5b3b6d9c8d7';
        });
    </script>
</body>
</html>
